<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Focus</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      color: #1f2937;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 20px;
    }

    .header a {
      font-size: 0.9em;
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    h1 {
      font-size: 2em;
      color: #667eea;
      flex: 1;
    }

    .date-display {
      font-size: 0.9em;
      color: #6b7280;
    }

    /* Morning Ritual Section */
    .ritual-section {
      background: white;
      border: 2px solid #667eea;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 30px;
      text-align: center;
    }

    .ritual-section h2 {
      font-size: 1.1em;
      color: #667eea;
      margin-bottom: 16px;
    }

    .btn-pick-focus {
      padding: 14px 32px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-pick-focus:hover {
      background: #5568d3;
    }

    /* Tasks Section */
    .tasks-section {
      background: white;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .tasks-section h2 {
      font-size: 1.3em;
      color: #1f2937;
      margin-bottom: 20px;
    }

    .task-item {
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: all 0.2s;
    }

    .task-item:hover {
      border-color: #667eea;
      background: #f0f1ff;
    }

    .task-item.completed {
      background: #ecfdf5;
      border-color: #10b981;
      opacity: 0.7;
    }

    .task-rank {
      font-size: 2.5em;
      font-weight: 700;
      color: #667eea;
      min-width: 50px;
      text-align: center;
    }

    .task-item.completed .task-rank {
      color: #10b981;
    }

    .task-content {
      flex: 1;
    }

    .task-title {
      font-size: 1.1em;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 6px;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: #6b7280;
    }

    .task-action {
      font-size: 0.95em;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .task-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .task-area {
      font-size: 0.8em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 4px;
      background: #667eea;
      color: white;
    }

    .task-area.Work { background: #3b82f6; }
    .task-area.Health { background: #10b981; }
    .task-area.Parenting { background: #a855f7; }
    .task-area.Relationships { background: #f43f5e; }
    .task-area.Growth { background: #f59e0b; }

    .task-checkbox {
      width: 28px;
      height: 28px;
      cursor: pointer;
      accent-color: #667eea;
    }

    /* Habits Section */
    .habits-section {
      background: white;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .habits-section h2 {
      font-size: 1.1em;
      color: #1f2937;
      margin-bottom: 16px;
    }

    .habits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .habit-item {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .habit-item:hover {
      border-color: #667eea;
      background: #f0f1ff;
    }

    .habit-item.done {
      background: #ecfdf5;
      border-color: #10b981;
    }

    .habit-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .habit-name {
      font-size: 0.9em;
      font-weight: 600;
      color: #1f2937;
    }

    /* Progress Section */
    .progress-section {
      background: white;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 30px;
      text-align: center;
    }

    .progress-label {
      font-size: 0.9em;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .progress-stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-number {
      font-size: 2.5em;
      font-weight: 700;
      color: #667eea;
    }

    .stat-label {
      font-size: 0.85em;
      color: #6b7280;
      margin-top: 4px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: #667eea;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.85em;
      color: #6b7280;
    }

    /* Celebration */
    .celebration {
      display: none;
      background: #ecfdf5;
      border: 2px solid #10b981;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      margin-bottom: 30px;
      animation: slideIn 0.5s ease;
    }

    .celebration.show {
      display: block;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .celebration h3 {
      font-size: 1.5em;
      color: #10b981;
      margin-bottom: 8px;
    }

    .celebration p {
      color: #059669;
      font-size: 1em;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      overflow-y: auto;
      padding: 40px 20px;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      border-radius: 8px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      font-size: 1.5em;
      color: #667eea;
      margin-bottom: 20px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 12px;
    }

    .available-tasks {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      max-height: 400px;
      overflow-y: auto;
    }

    .available-task {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .available-task:hover {
      border-color: #667eea;
      background: #f0f1ff;
    }

    .available-task.selected {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .available-task-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .available-task-area {
      font-size: 0.8em;
      opacity: 0.7;
    }

    .selected-for-today {
      margin-bottom: 20px;
      padding: 16px;
      background: #f0f1ff;
      border-radius: 6px;
    }

    .selected-for-today h4 {
      font-size: 0.9em;
      color: #667eea;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .selected-task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 8px;
      border: 1px solid #e5e7eb;
    }

    .rank-input {
      width: 50px;
      padding: 6px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 1.1em;
      font-weight: 700;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .btn-modal {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.2s;
    }

    .btn-confirm {
      background: #667eea;
      color: white;
    }

    .btn-confirm:hover {
      background: #5568d3;
    }

    .btn-cancel {
      background: #e5e7eb;
      color: #1f2937;
    }

    .btn-cancel:hover {
      background: #d1d5db;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #9ca3af;
    }

    .empty-state h3 {
      font-size: 1.1em;
      color: #6b7280;
      margin-bottom: 8px;
    }

    @media (max-width: 768px) {
      .habits-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .progress-stats {
        gap: 12px;
      }

      .stat-number {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html">← Back to Hub</a>
      <h1>Today's Focus</h1>
      <div class="date-display" id="dateDisplay"></div>
    </div>

    <div id="celebration" class="celebration">
      <h3>✨ Amazing work!</h3>
      <p id="celebrationText"></p>
    </div>

    <div class="ritual-section">
      <h2>🎯 Morning Ritual</h2>
      <p style="margin-bottom: 16px; color: #6b7280;">Pick your 3 most important tasks for today</p>
      <button class="btn-pick-focus" onclick="openPickModal()">Pick Today's 3 Tasks</button>
    </div>

    <div class="tasks-section" id="tasksSection">
      <h2>Your 3 Tasks</h2>
      <div id="tasksContainer"></div>
    </div>

    <div class="habits-section" id="habitsSection">
      <h2>Today's Habits</h2>
      <div class="habits-grid" id="habitsContainer"></div>
    </div>

    <div class="progress-section">
      <div class="progress-label">Daily Progress</div>
      <div class="progress-stats">
        <div class="stat">
          <div class="stat-number" id="tasksCompleted">0</div>
          <div class="stat-label">Tasks Complete</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="habitsCompleted">0</div>
          <div class="stat-label">Habits Done</div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
      <div class="progress-text" id="progressText">0 of 3 tasks complete</div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="pickModal">
    <div class="modal-content">
      <div class="modal-header">Pick Your 3 Tasks</div>

      <div class="selected-for-today">
        <h4>Selected for Today (drag to reorder)</h4>
        <div id="selectedTasksList"></div>
      </div>

      <div>
        <h4 style="font-size: 0.9em; color: #667eea; margin-bottom: 12px; font-weight: 700;">Available Tasks</h4>
        <div class="available-tasks" id="availableTasksList"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-confirm" onclick="saveSelection()">Confirm & Close</button>
        <button class="btn-modal btn-cancel" onclick="closePickModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const TASKS_KEY = 'gtd_tasks';
    const TODAY_KEY = 'gtd_today_selected';
    const HABITS_KEY = 'habits'; // from habits tracker

    let selectedTasks = [];

    // Initialize on load
    window.addEventListener('load', () => {
      updateDateDisplay();
      loadTodaysFocus();
      loadHabits();
      updateProgress();
    });

    function updateDateDisplay() {
      const today = new Date();
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('dateDisplay').textContent = today.toLocaleDateString('en-US', options);
    }

    function loadTodaysFocus() {
      const selected = JSON.parse(localStorage.getItem(TODAY_KEY) || '[]');
      selectedTasks = selected;

      const container = document.getElementById('tasksContainer');

      if (selectedTasks.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>No tasks selected</h3><p>Click "Pick Today\'s 3 Tasks" above to get started</p></div>';
        return;
      }

      container.innerHTML = selectedTasks.map((task, index) => `
        <div class="task-item ${task.completed ? 'completed' : ''}">
          <div class="task-rank">${index + 1}</div>
          <div class="task-content">
            <div class="task-title">${escapeHtml(task.title)}</div>
            <div class="task-action">${escapeHtml(task.nextAction)}</div>
            <div class="task-meta">
              <div class="task-area ${task.area}">${task.area}</div>
            </div>
          </div>
          <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
        </div>
      `).join('');
    }

    function toggleTask(index) {
      selectedTasks[index].completed = !selectedTasks[index].completed;
      localStorage.setItem(TODAY_KEY, JSON.stringify(selectedTasks));

      const allComplete = selectedTasks.every(t => t.completed);
      if (allComplete && selectedTasks.length > 0) {
        showCelebration();
      }

      loadTodaysFocus();
      updateProgress();
    }

    function showCelebration() {
      const celebration = document.getElementById('celebration');
      const completedCount = selectedTasks.length;
      document.getElementById('celebrationText').textContent = `You crushed all ${completedCount} tasks today! 🎉`;
      celebration.classList.add('show');
      setTimeout(() => celebration.classList.remove('show'), 4000);
    }

    function loadHabits() {
      // Load from habits tracker - must match habits_tracker.html structure
      const dateKey = new Date().toISOString().split('T')[0];

      // These must match the order in habits_tracker.html uniqueHabits array
      const essentialHabits = ['Sommeil', 'Méditation', 'Plan', 'Journal', 'Lecture', 'Étirements', 'Cardio', 'Weightlifting', 'Protéines/Bouffe', 'Consommation eau', 'Soleil matinal', 'Marche midi', 'Big P', 'Big W', 'QT Friends', 'QT Matteo', 'QT Felix', 'QT Girlfriend'];
      const optionalHabits = ['Nouvelle recette', 'Pratique guitare ou piano', 'Rangement-menage'];
      const uniqueHabits = [...essentialHabits, ...optionalHabits];

      // Show only key habits in daily focus
      const habitsToShow = ['Méditation', 'Journal', 'Plan', 'Étirements', 'Cardio'];
      const container = document.getElementById('habitsContainer');

      container.innerHTML = habitsToShow.map(habit => {
        // Find the index of this habit in uniqueHabits
        const habitIndex = uniqueHabits.indexOf(habit);
        const isChecked = localStorage.getItem(`${dateKey}-habit-${habitIndex}`) === 'true';
        return `
          <div class="habit-item ${isChecked ? 'done' : ''}" onclick="toggleHabit(${habitIndex}, '${habit}')">
            <input type="checkbox" class="habit-checkbox" ${isChecked ? 'checked' : ''} onchange="event.stopPropagation()">
            <span class="habit-name">${habit}</span>
          </div>
        `;
      }).join('');
    }

    function toggleHabit(habitIndex, habitName) {
      const dateKey = new Date().toISOString().split('T')[0];
      const key = `${dateKey}-habit-${habitIndex}`;
      const isChecked = localStorage.getItem(key) === 'true';
      localStorage.setItem(key, !isChecked);
      loadHabits();
      updateProgress();
    }

    function updateProgress() {
      const tasksCompleted = selectedTasks.filter(t => t.completed).length;
      const tasksTotal = selectedTasks.length;

      // Count habits done - using same index system as habits_tracker
      const dateKey = new Date().toISOString().split('T')[0];
      const essentialHabits = ['Sommeil', 'Méditation', 'Plan', 'Journal', 'Lecture', 'Étirements', 'Cardio', 'Weightlifting', 'Protéines/Bouffe', 'Consommation eau', 'Soleil matinal', 'Marche midi', 'Big P', 'Big W', 'QT Friends', 'QT Matteo', 'QT Felix', 'QT Girlfriend'];
      const optionalHabits = ['Nouvelle recette', 'Pratique guitare ou piano', 'Rangement-menage'];
      const uniqueHabits = [...essentialHabits, ...optionalHabits];

      const habitsToShow = ['Méditation', 'Journal', 'Plan', 'Étirements', 'Cardio'];
      const habitsCompleted = habitsToShow.filter(h => {
        const index = uniqueHabits.indexOf(h);
        return localStorage.getItem(`${dateKey}-habit-${index}`) === 'true';
      }).length;

      document.getElementById('tasksCompleted').textContent = tasksCompleted;
      document.getElementById('habitsCompleted').textContent = habitsCompleted;

      const totalItems = tasksTotal + habitsToShow.length;
      const totalComplete = tasksCompleted + habitsCompleted;
      const percentage = totalItems > 0 ? (totalComplete / totalItems) * 100 : 0;

      document.getElementById('progressFill').style.width = `${percentage}%`;
      document.getElementById('progressText').textContent = `${tasksCompleted} of ${tasksTotal} tasks complete • ${habitsCompleted} of ${habitsToShow.length} habits`;
    }

    function openPickModal() {
      loadAvailableTasks();
      document.getElementById('pickModal').classList.add('active');
    }

    function closePickModal() {
      document.getElementById('pickModal').classList.remove('active');
    }

    function loadAvailableTasks() {
      const allTasks = JSON.parse(localStorage.getItem(TASKS_KEY) || '[]');
      console.log('All tasks from storage:', allTasks);

      const activeTasks = allTasks.filter(t => t.status === 'active').sort((a, b) => {
        if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
        return 0;
      });

      console.log('Active tasks after filter:', activeTasks);

      const selectedIds = new Set(selectedTasks.map(t => t.id));

      const container = document.getElementById('availableTasksList');
      if (activeTasks.length === 0) {
        const inboxCount = JSON.parse(localStorage.getItem('gtd_inbox') || '[]').length;
        container.innerHTML = `
          <div class="empty-state">
            <p>No active tasks available.</p>
            <p style="font-size: 0.85em; color: #6b7280; margin-top: 8px;">
              ${inboxCount > 0 ? `You have ${inboxCount} items in inbox — process them to create tasks.` : 'Capture items in your inbox first, then process them.'}
            </p>
          </div>
        `;
        return;
      }

      container.innerHTML = activeTasks.map(task => `
        <div class="available-task ${selectedIds.has(task.id) ? 'selected' : ''}" onclick="toggleTaskSelection('${task.id}')">
          <div class="available-task-title">${escapeHtml(task.title)}</div>
          <div class="available-task-area">${task.area} • ${task.nextAction.substring(0, 40)}... ${task.dueDate ? '• ' + new Date(task.dueDate).toLocaleDateString('en-US', {month: 'short', day: 'numeric'}) : ''}</div>
        </div>
      `).join('');

      updateSelectedList(activeTasks);
    }

    function toggleTaskSelection(taskId) {
      const allTasks = JSON.parse(localStorage.getItem(TASKS_KEY) || '[]');
      const task = allTasks.find(t => t.id === taskId);

      const selectedIndex = selectedTasks.findIndex(t => t.id === taskId);

      if (selectedIndex > -1) {
        selectedTasks.splice(selectedIndex, 1);
      } else {
        if (selectedTasks.length < 3) {
          selectedTasks.push(task);
        }
      }

      loadAvailableTasks();
    }

    function updateSelectedList(allTasks) {
      const container = document.getElementById('selectedTasksList');

      if (selectedTasks.length === 0) {
        container.innerHTML = '<p style="color: #9ca3af; font-size: 0.9em;">No tasks selected yet</p>';
        return;
      }

      container.innerHTML = selectedTasks.map((task, index) => `
        <div class="selected-task-item">
          <input type="number" class="rank-input" value="${index + 1}" min="1" max="3" onchange="updateRank(${index}, this.value)">
          <div style="flex: 1;">
            <div style="font-weight: 600; color: #1f2937;">${escapeHtml(task.title)}</div>
            <div style="font-size: 0.85em; color: #6b7280;">${task.area}</div>
          </div>
          <button onclick="removeFromSelection(${index})" style="background: none; border: none; color: #dc2626; cursor: pointer; font-size: 1.2em;">✕</button>
        </div>
      `).join('');
    }

    function updateRank(index, newRank) {
      const rank = Math.max(1, Math.min(3, parseInt(newRank) || 1));
      const task = selectedTasks[index];
      selectedTasks.splice(index, 1);
      selectedTasks.splice(rank - 1, 0, task);
      updateSelectedList();
    }

    function removeFromSelection(index) {
      selectedTasks.splice(index, 1);
      loadAvailableTasks();
    }

    function saveSelection() {
      if (selectedTasks.length === 0) {
        alert('Please select at least 1 task');
        return;
      }

      // Reset completed status for new day
      selectedTasks = selectedTasks.map(t => ({...t, completed: false}));
      localStorage.setItem(TODAY_KEY, JSON.stringify(selectedTasks));
      closePickModal();
      loadTodaysFocus();
      updateProgress();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Close modal on background click
    document.getElementById('pickModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('pickModal')) {
        closePickModal();
      }
    });
  </script>
</body>
</html>
