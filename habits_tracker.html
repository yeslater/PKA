<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habits Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7ff;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header {
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }

        .date-nav {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .date-nav button {
            padding: 8px 12px;
            font-size: 13px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .date-nav button:hover {
            background: #e0e0e0;
        }

        .date-nav input {
            padding: 8px 12px;
            font-size: 13px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }

        .date-nav .current-date {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            min-width: 150px;
        }

        .date {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .habits-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .habit-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .habit-item:hover {
            background: #f0f2ff;
            border-color: #667eea;
        }

        .habit-item.done {
            background: #e8f5e9;
            border-color: #2e7d32;
        }

        .habit-item.done label {
            color: #2e7d32;
            font-weight: 600;
        }

        .habit-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .habit-item label {
            cursor: pointer;
            font-size: 14px;
            color: #333;
            flex: 1;
            user-select: none;
        }

        .habit-item.optional label::after {
            content: ' (opt)';
            font-size: 12px;
            color: #999;
            font-weight: 400;
        }

        .habit-item.essential label::before {
            content: '★ ';
            color: #ff9800;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: #667eea;
            color: white;
            flex: 1;
        }

        .btn-save:hover {
            background: #764ba2;
        }

        .btn-save:active {
            transform: scale(0.98);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }

        .status.error {
            background: #ffe8e8;
            color: #d32f2f;
            display: block;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #999;
            text-align: center;
        }

        .progress {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        .progress-bar {
            background: #f0f0f0;
            border-radius: 4px;
            height: 8px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            background: #667eea;
            height: 100%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="date-nav">
                <button onclick="previousDay()">← Previous</button>
                <input type="date" id="dateInput" onchange="goToDate()">
                <button onclick="todayButton()">Today</button>
                <button onclick="nextDay()">Next →</button>
            </div>
            <div class="date" id="dateDisplay"></div>
            <div class="title">Daily Habits</div>
        </div>

        <div class="habits-grid" id="habitsGrid"></div>

        <div class="progress">
            <div id="progressText">0 of 19 completed</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="actions">
            <button class="btn-save" onclick="saveToDatabase()">Save to Database</button>
            <button class="btn-reset" onclick="resetCheckboxes()">Clear All</button>
        </div>

        <div class="status" id="status"></div>

        <div class="footer">
            Tracker started: 2026-04-25 | Updated: 2026-04-25 | Data saved to PKA.db<br>
            <small>★ = Essential | (opt) = Optional</small>
        </div>
    </div>

    <script>
        let currentDate = new Date();

        const habits = [
            'Sommeil',
            'Méditation',
            'Plan',
            'Journal',
            'Lecture',
            'Étirements',
            'Cardio',
            'Weightlifting',
            'Protéines/Bouffe',
            'Big P',
            'Big W',
            'QT Friends',
            'QT Matteo',
            'QT Felix',
            'QT Girlfriend',
            'Plan'
        ];

        // Remove duplicate 'Plan' from the list
        const essentialHabits = [
            'Sommeil',
            'Méditation',
            'Plan',
            'Journal',
            'Lecture',
            'Étirements',
            'Cardio',
            'Weightlifting',
            'Protéines/Bouffe',
            'Consommation eau',
            'Big P',
            'Big W',
            'QT Friends',
            'QT Matteo',
            'QT Felix',
            'QT Girlfriend'
        ];

        const optionalHabits = [
            'Nouvelle recette',
            'Pratique guitare ou piano',
            'Rangement-menage'
        ];

        const uniqueHabits = [...essentialHabits, ...optionalHabits];

        function formatDate(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        function getDateKey(date) {
            return date.toISOString().split('T')[0];
        }

        function updateDateDisplay() {
            const dateKey = getDateKey(currentDate);
            const today = getDateKey(new Date());
            let displayText = formatDate(currentDate);

            if (dateKey === today) {
                displayText += ' (Today)';
            } else if (dateKey < today) {
                const daysAgo = Math.floor((new Date() - currentDate) / (1000 * 60 * 60 * 24));
                displayText += ` (${daysAgo} ${daysAgo === 1 ? 'day' : 'days'} ago)`;
            }

            document.getElementById('dateDisplay').textContent = displayText;
            document.getElementById('dateInput').value = dateKey;
        }

        function previousDay() {
            currentDate.setDate(currentDate.getDate() - 1);
            updateDateDisplay();
            loadDay();
        }

        function nextDay() {
            currentDate.setDate(currentDate.getDate() + 1);
            updateDateDisplay();
            loadDay();
        }

        function todayButton() {
            currentDate = new Date();
            updateDateDisplay();
            loadDay();
        }

        function goToDate() {
            const dateInput = document.getElementById('dateInput').value;
            if (dateInput) {
                currentDate = new Date(dateInput + 'T00:00:00');
                updateDateDisplay();
                loadDay();
            }
        }

        function loadDay() {
            const dateKey = getDateKey(currentDate);
            document.querySelectorAll('input[type="checkbox"]').forEach((checkbox, index) => {
                const savedValue = localStorage.getItem(`${dateKey}-habit-${index}`);
                checkbox.checked = savedValue === 'true';
                toggleHabitStyle(index);
            });
            updateProgress();
        }

        function initializeUI() {
            // Initialize current date
            updateDateDisplay();

            // Create habit checkboxes
            const grid = document.getElementById('habitsGrid');
            grid.innerHTML = '';

            uniqueHabits.forEach((habit, index) => {
                const div = document.createElement('div');
                div.className = 'habit-item';
                if (optionalHabits.includes(habit)) {
                    div.classList.add('optional');
                } else {
                    div.classList.add('essential');
                }
                div.id = `habit-${index}`;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `check-${index}`;
                checkbox.onchange = () => {
                    updateProgress();
                    toggleHabitStyle(index);
                };

                const label = document.createElement('label');
                label.htmlFor = `check-${index}`;
                label.textContent = habit;

                div.appendChild(checkbox);
                div.appendChild(label);
                grid.appendChild(div);
            });

            loadDay();
        }

        function toggleHabitStyle(index) {
            const item = document.getElementById(`habit-${index}`);
            const checkbox = document.getElementById(`check-${index}`);

            if (checkbox.checked) {
                item.classList.add('done');
            } else {
                item.classList.remove('done');
            }
        }

        function updateProgress() {
            const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
            const total = uniqueHabits.length;
            const percentage = (checked / total) * 100;

            document.getElementById('progressText').textContent = `${checked} of ${total} completed`;
            document.getElementById('progressFill').style.width = `${percentage}%`;
        }

        function resetCheckboxes() {
            const dateKey = getDateKey(currentDate);
            const confirmMsg = dateKey === getDateKey(new Date())
                ? 'Clear all checkboxes for today?'
                : `Clear all checkboxes for ${formatDate(currentDate)}?`;

            if (confirm(confirmMsg)) {
                document.querySelectorAll('input[type="checkbox"]').forEach((checkbox, index) => {
                    checkbox.checked = false;
                    localStorage.removeItem(`${dateKey}-habit-${index}`);
                    toggleHabitStyle(index);
                });
                updateProgress();
            }
        }

        function saveToDatabase() {
            const dateKey = getDateKey(currentDate);
            const data = {};

            uniqueHabits.forEach((habit, index) => {
                const checkbox = document.getElementById(`check-${index}`);
                data[habit] = checkbox.checked ? 1 : 0;
                // Save to localStorage with date key
                localStorage.setItem(`${dateKey}-habit-${index}`, checkbox.checked);
            });

            // Send data to server (would be the Python backend)
            const today = getDateKey(new Date());
            const isTodaysData = dateKey === today;
            const message = isTodaysData
                ? '✓ Saved today'
                : `✓ Saved ${formatDate(currentDate)}`;

            fetch('/api/save-habits', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    date: dateKey,
                    habits: data
                })
            })
            .then(response => {
                if (response.ok) {
                    showStatus(message, 'success');
                } else {
                    showStatus(`⚠ ${message} (offline)`, 'success');
                }
            })
            .catch(error => {
                // Gracefully degrade to localStorage only
                showStatus(message, 'success');
            });
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            setTimeout(() => {
                status.classList.remove('success', 'error');
            }, 3000);
        }

        // Initialize on page load
        window.onload = initializeUI;
    </script>
</body>
</html>
