<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Journal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9fafb;
      color: #1f2937;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 2px solid #667eea;
    }

    .sidebar-header h2 {
      font-size: 1.2em;
      color: #667eea;
      margin-bottom: 12px;
    }

    .date-picker {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .date-picker input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.9em;
    }

    .date-nav {
      display: flex;
      gap: 8px;
    }

    .date-nav button {
      flex: 1;
      padding: 8px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: 600;
    }

    .date-nav button:hover {
      background: #5568d3;
    }

    .sidebar-content {
      padding: 16px;
      flex: 1;
    }

    .entries-header {
      font-size: 0.85em;
      font-weight: 700;
      color: #667eea;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .entries-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .entry-item {
      padding: 12px;
      background: #f3f4f6;
      border-left: 3px solid #e5e7eb;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      font-size: 0.9em;
    }

    .entry-item:hover {
      background: #e5e7eb;
      border-left-color: #667eea;
    }

    .entry-item.active {
      background: #667eea;
      color: white;
      border-left-color: #667eea;
    }

    .entry-date {
      font-weight: 600;
      font-size: 0.85em;
      margin-bottom: 2px;
    }

    .entry-preview {
      font-size: 0.8em;
      opacity: 0.8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .main-header {
      padding: 24px 32px;
      border-bottom: 2px solid #667eea;
      background: white;
    }

    .main-header h1 {
      font-size: 2em;
      color: #667eea;
      margin-bottom: 8px;
    }

    .main-date {
      font-size: 0.95em;
      color: #6b7280;
    }

    .main-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Editor */
    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e5e7eb;
    }

    .editor-title {
      padding: 16px 32px 8px;
      font-size: 1.1em;
      font-weight: 700;
      color: #1f2937;
    }

    .editor {
      flex: 1;
      padding: 0 32px 32px;
      display: flex;
      flex-direction: column;
    }

    #journalEntry {
      flex: 1;
      padding: 16px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-family: inherit;
      font-size: 1em;
      line-height: 1.8;
      resize: none;
      color: #1f2937;
    }

    #journalEntry:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .editor-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9em;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .save-status {
      font-size: 0.85em;
      color: #6b7280;
      margin-top: 8px;
    }

    /* Team Responses */
    .responses-section {
      width: 320px;
      display: flex;
      flex-direction: column;
      background: #f9fafb;
      border-left: 1px solid #e5e7eb;
      overflow-y: auto;
    }

    .responses-header {
      padding: 16px;
      border-bottom: 2px solid #667eea;
      background: white;
    }

    .responses-header h3 {
      font-size: 1em;
      color: #667eea;
      font-weight: 700;
    }

    .responses-content {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }

    .response-item {
      background: white;
      border-left: 4px solid #667eea;
      padding: 16px;
      margin-bottom: 16px;
      border-radius: 4px;
    }

    .response-cluster {
      font-size: 0.85em;
      font-weight: 700;
      color: #667eea;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .response-text {
      font-size: 0.9em;
      line-height: 1.6;
      color: #374151;
    }

    .no-responses {
      color: #9ca3af;
      font-size: 0.9em;
      text-align: center;
      padding: 32px 16px;
    }

    .load-responses {
      padding: 12px;
      border: 2px dashed #d1d5db;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      background: #f3f4f6;
      font-size: 0.85em;
      color: #6b7280;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .load-responses:hover {
      border-color: #667eea;
      background: #f0f1ff;
      color: #667eea;
    }

    .load-responses input[type="file"] {
      display: none;
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .responses-section {
        width: 280px;
      }
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        max-height: 200px;
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
      }

      .main-content {
        flex-direction: column;
      }

      .editor-section {
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
      }

      .responses-section {
        width: 100%;
        height: 300px;
        border-left: none;
        border-top: 1px solid #e5e7eb;
      }

      .main-header {
        padding: 16px;
      }

      .editor {
        padding: 0 16px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sidebar with date navigation and entries list -->
    <div class="sidebar">
      <div class="sidebar-header">
        <a href="index.html" style="display: inline-block; margin-bottom: 12px; font-size: 0.9em; color: #667eea; text-decoration: none; font-weight: 600;">← Back to Hub</a>
        <h2>Journal</h2>
        <div class="date-picker">
          <input type="date" id="dateInput">
        </div>
        <div class="date-nav">
          <button onclick="navigateDate(-1)">← Prev</button>
          <button onclick="goToToday()">Today</button>
          <button onclick="navigateDate(1)">Next →</button>
        </div>
      </div>
      <div class="sidebar-content">
        <div class="entries-header">Recent Entries</div>
        <div class="entries-list" id="entriesList"></div>
      </div>
    </div>

    <!-- Main content area -->
    <div class="main">
      <div class="main-header">
        <h1>Daily Journal</h1>
        <div class="main-date" id="mainDate"></div>
      </div>

      <div class="main-content">
        <!-- Editor -->
        <div class="editor-section">
          <div class="editor-title">Today's Entry</div>
          <div class="editor">
            <textarea id="journalEntry" placeholder="Write your thoughts, feelings, reflections, and observations for today..."></textarea>
            <div class="editor-actions">
              <button class="btn btn-primary" onclick="saveEntry()">Save Entry</button>
              <button class="btn btn-secondary" onclick="deleteEntry()">Delete</button>
            </div>
            <div class="save-status" id="saveStatus"></div>
          </div>
        </div>

        <!-- Team responses -->
        <div class="responses-section">
          <div class="responses-header">
            <h3>Team Responses</h3>
            <button class="btn btn-primary" id="generateBtn" onclick="generateResponses()" style="width: 100%; margin-top: 8px;">Generate Responses</button>
            <div id="generateStatus" style="font-size: 0.8em; margin-top: 8px; text-align: center;"></div>
          </div>
          <div class="responses-content" id="responsesContent">
            <div class="no-responses">No team responses yet for this day</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentDate = new Date();

    function formatDate(date) {
      return date.toISOString().split('T')[0];
    }

    function formatDisplayDate(date) {
      return date.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function getStorageKey(date) {
      return `journal_${formatDate(date)}`;
    }

    function loadEntry() {
      const key = getStorageKey(currentDate);
      const entry = localStorage.getItem(key) || '';
      document.getElementById('journalEntry').value = entry;
      document.getElementById('dateInput').value = formatDate(currentDate);
      document.getElementById('mainDate').textContent = formatDisplayDate(currentDate);
      updateEntriesList();
      loadTeamResponses();
      clearSaveStatus();
    }

    function saveEntry() {
      const key = getStorageKey(currentDate);
      const entry = document.getElementById('journalEntry').value;
      localStorage.setItem(key, entry);
      showSaveStatus('Entry saved successfully');
      updateEntriesList();
    }

    function deleteEntry() {
      if (confirm('Are you sure you want to delete this entry?')) {
        const key = getStorageKey(currentDate);
        localStorage.removeItem(key);
        document.getElementById('journalEntry').value = '';
        showSaveStatus('Entry deleted');
        updateEntriesList();
      }
    }

    function showSaveStatus(message) {
      const status = document.getElementById('saveStatus');
      status.textContent = message;
      status.style.color = '#10b981';
      setTimeout(() => clearSaveStatus(), 2000);
    }

    function clearSaveStatus() {
      document.getElementById('saveStatus').textContent = '';
    }

    function navigateDate(days) {
      currentDate.setDate(currentDate.getDate() + days);
      loadEntry();
    }

    function goToToday() {
      currentDate = new Date();
      loadEntry();
    }

    function updateEntriesList() {
      const list = document.getElementById('entriesList');
      list.innerHTML = '';

      // Get all entries from localStorage
      const entries = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('journal_')) {
          const date = key.replace('journal_', '');
          const content = localStorage.getItem(key);
          if (content.trim()) {
            entries.push({ date, content });
          }
        }
      }

      // Sort by date descending
      entries.sort((a, b) => new Date(b.date) - new Date(a.date));

      // Show recent entries
      entries.slice(0, 30).forEach(entry => {
        const entryDate = new Date(entry.date + 'T00:00:00');
        const div = document.createElement('div');
        div.className = 'entry-item';
        if (entry.date === formatDate(currentDate)) {
          div.classList.add('active');
        }
        div.innerHTML = `
          <div class="entry-date">${entryDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
          <div class="entry-preview">${entry.content.substring(0, 40)}...</div>
        `;
        div.onclick = () => {
          currentDate = new Date(entry.date + 'T00:00:00');
          loadEntry();
        };
        list.appendChild(div);
      });
    }

    function loadTeamResponses() {
      const dateStr = formatDate(currentDate);
      const responsesKey = `responses_${dateStr}`;
      const responses = localStorage.getItem(responsesKey);

      const responsesContent = document.getElementById('responsesContent');

      if (responses) {
        try {
          const data = JSON.parse(responses);
          responsesContent.innerHTML = '';

          // Check if responses exist
          if (!data.clusters || data.clusters.length === 0) {
            responsesContent.innerHTML = '<div class="no-responses">No team responses yet for this day</div>';
            return;
          }

          data.clusters.forEach(cluster => {
            const div = document.createElement('div');
            div.className = 'response-item';
            div.innerHTML = `
              <div class="response-cluster">${cluster.name}</div>
              <div class="response-text">${cluster.content}</div>
            `;
            responsesContent.appendChild(div);
          });
        } catch (e) {
          responsesContent.innerHTML = '<div class="no-responses">Error loading responses</div>';
        }
      } else {
        responsesContent.innerHTML = '<div class="no-responses">No team responses yet for this day</div>';
      }
    }

    async function generateResponses() {
      const entry = document.getElementById('journalEntry').value.trim();

      if (!entry) {
        alert('Please write something in your journal entry first.');
        return;
      }

      const btn = document.getElementById('generateBtn');
      const status = document.getElementById('generateStatus');

      btn.disabled = true;
      btn.style.opacity = '0.6';
      status.textContent = 'Generating...';
      status.style.color = '#667eea';

      try {
        const response = await fetch('http://localhost:3847/generate-responses', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            journalEntry: entry,
            date: formatDate(currentDate)
          })
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();

        // Save to localStorage
        const responsesKey = `responses_${formatDate(currentDate)}`;
        localStorage.setItem(responsesKey, JSON.stringify(data));

        // Refresh display
        loadTeamResponses();

        status.textContent = '✓ Responses generated!';
        status.style.color = '#10b981';
        setTimeout(() => {
          status.textContent = '';
        }, 2000);
      } catch (error) {
        console.error('Error:', error);
        status.textContent = 'Error: Make sure the server is running';
        status.style.color = '#ef4444';
        alert('Could not generate responses. Make sure the generation server is running.\n\nRun this in a terminal:\npython3 generate_journal_responses.py');
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }

    // Support drag and drop
    document.addEventListener('dragover', (e) => {
      e.preventDefault();
      const area = document.getElementById('loadResponsesArea');
      if (area) {
        area.style.borderColor = '#667eea';
        area.style.background = '#f0f1ff';
      }
    });

    document.addEventListener('dragleave', (e) => {
      const area = document.getElementById('loadResponsesArea');
      if (area && !area.contains(e.relatedTarget)) {
        area.style.borderColor = '';
        area.style.background = '';
      }
    });

    document.addEventListener('drop', (e) => {
      e.preventDefault();
      const area = document.getElementById('loadResponsesArea');
      area.style.borderColor = '';
      area.style.background = '';

      const files = e.dataTransfer.files;
      if (files.length > 0) {
        const file = files[0];
        if (file.type === 'application/json' || file.name.endsWith('.json')) {
          const reader = new FileReader();
          reader.onload = function(event) {
            try {
              const data = JSON.parse(event.target.result);
              const responsesKey = `responses_${data.date}`;
              localStorage.setItem(responsesKey, JSON.stringify(data));

              if (data.date === formatDate(currentDate)) {
                loadTeamResponses();
              }

              area.textContent = '✓ Responses loaded!';
              area.style.borderColor = '#10b981';
              area.style.color = '#10b981';
              setTimeout(() => {
                area.textContent = '📂 Drop responses file here or click to load';
                area.style.borderColor = '';
                area.style.color = '';
              }, 2000);
            } catch (error) {
              alert('Error loading file: ' + error.message);
            }
          };
          reader.readAsText(file);
        }
      }
    });

    // Auto-save on input
    let autoSaveTimer;
    document.getElementById('journalEntry').addEventListener('input', () => {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        saveEntry();
      }, 2000);
    });

    // Initialize
    loadEntry();
  </script>
</body>
</html>
